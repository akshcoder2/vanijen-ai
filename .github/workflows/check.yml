name: Source checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q jarvis.py avatar.py voice_chat.py desktop_actions.py news.py camera.py vision.py voice_activity.py
